# Wing of Nostalgia: Repository Governance Configuration
# Version: 1.0.0
# Last Updated: 2026-01-08

repository:
  visibility: public
  topics:
    - flutter
    - dart
    - islamic-principles
    - emotional-intelligence
    - psychological-analysis
    - marriage-counseling

branch_protection:
  main:
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
    required_status_checks:
      strict: true
      contexts:
        - "analyze"
        - "test"
        - "islamic-compliance-scan"
    enforce_admins: true
    required_linear_history: true
    allow_force_pushes: false
    allow_deletions: false

access_control:
  roles:
    admin:
      - repository-owners
    maintainer:
      - core-developers
    triage:
      - community-moderators

policies:
  security:
    secret_scanning: enabled
    push_protection: enabled
  compliance:
    islamic_purity_protocol: enforced
    quranic_reference_validation: required
  maintenance:
    automated_cleanup: enabled
    dependency_updates: weekly

governance_board:
  - role: "Technical Lead"
    responsibilities: ["Architecture", "Performance", "Security"]
  - role: "Sharia Reviewer"
    responsibilities: ["Islamic Content Compliance", "Values Integrity"]
  - role: "Product Owner"
    responsibilities: ["User Experience", "Strategic Vision"]
