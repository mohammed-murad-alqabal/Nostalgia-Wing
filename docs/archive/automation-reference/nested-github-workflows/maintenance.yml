name: Sovereign Security & Maintenance

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  workflow_dispatch:

jobs:
  security-audit:
    name: Security & Health Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Security Audit (Pub Outdated)
        run: |
          echo "Checking for security-related updates..."
          flutter pub outdated --mode=security
          echo "Checking for all outdated packages..."
          flutter pub outdated

      - name: Audit Core Protocols
        run: |
          echo "Verifying Sovereign Protocol Integrity..."
          # Check for forbidden patterns in cognitive modules
          grep -r "dart:io" lib/core/cognitive && echo "Warning: Local IO in cognitive modules detected." || echo "Cognitive Integrity: OK"

  stale-management:
    name: Repository Maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Mark Stale Issues & PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "تم اعتبار هذا الموضوع قديماً (Stale) لعدم وجود نشاط لمدة 30 يوماً. سيتم إغلاقه خلال 7 أيام ما لم يتم إضافة رد."
          stale-pr-message: "تم اعتبار هذا PR قديماً لعدم وجود نشاط. سيتم إغلاقه قريباً."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
