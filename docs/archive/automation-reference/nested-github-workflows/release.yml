name: Sovereign Release Management

on:
    push:
        tags:
            - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
    workflow_dispatch:

jobs:
    build-and-release:
        name: Build & Release Sovereign Bundle
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Build Android APK (Release)
              run: flutter build apk --release

            - name: Build Android Bundle (AAB)
              run: flutter build appbundle --release

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: |
                      build/app/outputs/flutter-apk/app-release.apk
                      build/app/outputs/bundle/release/app-release.aab
                  body: |
                      ## 🚀 Sovereign Release ${{ github.ref_name }}

                      This release was automatically generated by the Sovereign Release Management engine.

                      ### 🛠️ Changes in this version
                      See the commit history for details.

                      ### ✅ Verification
                      - [x] Institutional QA Passed
                      - [x] Security Audit Completed
                      - [x] Production Build Successful
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
