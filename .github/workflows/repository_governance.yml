name: Repository governance

# Keep JavaScript-based actions on the supported Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository hygiene
        run: python3 scripts/verify_repository_hygiene.py --mode=enforce

      - name: Verify documentation governance
        run: python3 scripts/verify_documentation_governance.py

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
