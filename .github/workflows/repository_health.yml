name: Repository health report

# Keep JavaScript-based actions on the supported Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-report:
    name: Repository health report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch remote branches
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Build read-only report
        run: python3 scripts/repository_health_report.py --output reports/repository-health.md

      - name: Validate object database
        run: git fsck --full --no-dangling

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: repository-health-${{ github.run_id }}
          path: reports/repository-health.md
          if-no-files-found: error
          retention-days: 30
