name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation-governance:
    name: Documentation governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Verify documentation governance
        run: python3 scripts/verify_documentation_governance.py

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./active_source_wing
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Run unified quality gate
        run: bash tool/verify_flutter.sh
