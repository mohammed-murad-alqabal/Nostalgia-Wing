name: Flutter CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./active_source_wing

        steps:
            - uses: actions/checkout@v4

            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Install dependencies
              run: flutter pub get

            - name: Analyze
              run: flutter analyze

            - name: Run tests
              run: flutter test
