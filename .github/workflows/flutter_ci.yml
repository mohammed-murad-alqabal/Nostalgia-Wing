name: Flutter CI

# Keep JavaScript-based actions on the supported Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation-governance:
    name: Documentation governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Run documentation-governance regression tests
        run: python3 test_verify_documentation_governance.py
      - name: Verify documentation governance
        run: python3 scripts/verify_documentation_governance.py

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./active_source_wing
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Run unified quality gate
        run: bash tool/verify_flutter.sh

  platform-integration:
    name: Android privacy reset integration
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run privacy reset and restart test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash -lc '
            set -o pipefail
            cd active_source_wing
            mkdir -p android-integration-diagnostics
            flutter pub get 2>&1 | tee android-integration-diagnostics/pub-get.log
            pub_status=${PIPESTATUS[0]}
            if [ "$pub_status" -ne 0 ]; then
              exit "$pub_status"
            fi
            timeout --signal=TERM --kill-after=30s 10m \
              flutter test integration_test/privacy_reset_restart_test.dart \
                -d emulator-5554 --verbose 2>&1 | tee android-integration-diagnostics/flutter-test.log
            test_status=${PIPESTATUS[0]}
            adb devices -l > android-integration-diagnostics/adb-devices.log 2>&1 || true
            adb shell dumpsys activity activities > android-integration-diagnostics/adb-activity.log 2>&1 || true
            adb logcat -d -t 300 > android-integration-diagnostics/adb-logcat.log 2>&1 || true
            exit "$test_status"
            '

      - name: Upload Android integration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-integration-diagnostics-${{ github.run_id }}
          path: active_source_wing/android-integration-diagnostics/
          if-no-files-found: warn
          retention-days: 7
