name: Release validation

# Keep JavaScript-based actions on the supported Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: Run Flutter integration tests before building the release artifact
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android_release:
    name: Android release validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./active_source_wing

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Run unified quality gate
        run: bash tool/verify_flutter.sh

      - name: Run integration tests
        if: github.event_name == 'push' || inputs.run_integration_tests
        run: flutter test integration_test

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: nostalgia-wing-android-${{ github.ref_name || github.sha }}
          path: active_source_wing/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
