name: Release validation

# Keep JavaScript-based actions on the supported Node 24 runtime.

env:

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:

  workflow_dispatch:

    inputs:

      run_integration_tests:

        description: Run Flutter integration tests before building the release artifact

        required: true

        default: true

        type: boolean

  push:

    tags:

      - "v*.*.*"

concurrency:

  group: release-validation-${{ github.ref }}

  cancel-in-progress: false

permissions:

  contents: read

jobs:

  android_release:

    name: Android release validation

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: ./active_source_wing

    steps:

      - name: Checkout source

        uses: actions/checkout@v5

      - name: Set up Flutter

        uses: subosito/flutter-action@v2

        with:

          flutter-version: 3.47.0

          cache: true

          pub-cache: true

      - name: Show toolchain

        run: |
